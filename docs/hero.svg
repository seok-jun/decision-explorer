<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Behavior Explorer</title>
  <desc id="desc">이해할 곳은 선명하게. 맡길 곳은 검증 가능하게. 관찰, 비교, 이해와 위임.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2b"/><stop offset="1" stop-color="#152e39"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#bfd7e7" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="24" fill="url(#grid)"/>
  <g font-family="Segoe UI, Malgun Gothic, Apple SD Gothic Neo, sans-serif">
    <rect x="56" y="48" width="183" height="30" rx="15" fill="#24414b"/>
    <text x="75" y="68" fill="#95eadb" font-size="13" letter-spacing="1.5">AGENT SKILL · v0.3</text>
    <text x="56" y="150" font-size="58" font-weight="700" fill="#f3f8fc" letter-spacing="-2">Behavior Explorer</text>
    <text x="58" y="203" font-size="27" fill="#cfdee9">이해할 곳은 선명하게.</text>
    <text x="58" y="244" font-size="27" fill="#cfdee9">맡길 곳은 검증 가능하게.</text>
    <path d="M58 292H620" stroke="#527181" stroke-opacity=".6"/>
    <text x="58" y="331" font-size="17" fill="#8fdccb">OBSERVE</text>
    <text x="191" y="331" font-size="20" fill="#6b8795">→</text>
    <text x="234" y="331" font-size="17" fill="#a9caff">COMPARE</text>
    <text x="369" y="331" font-size="20" fill="#6b8795">→</text>
    <text x="412" y="331" font-size="17" fill="#dbe7ef">UNDERSTAND / DELEGATE</text>
    <text x="58" y="387" font-size="15" fill="#829dac">Concrete behavior. Visible evidence. Bounded delegation.</text>
    <g transform="translate(748 98)">
      <rect width="386" height="248" rx="16" fill="#0f202d" stroke="#355261"/>
      <text x="24" y="36" font-size="13" fill="#9cb3c3" letter-spacing="1.5">SAME INPUT. ONE DIFFERENCE.</text>
      <path d="M24 57H362" stroke="#2a4352"/>
      <path d="M48 103H145L210 89H334M145 103L210 173H334" fill="none" stroke="#4c6677" stroke-width="2"/>
      <circle cx="48" cy="103" r="7" fill="#dbe7ef"/>
      <circle cx="145" cy="103" r="7" fill="#dbe7ef"/>
      <circle cx="210" cy="89" r="9" fill="#7ce4d0"/>
      <circle cx="334" cy="89" r="7" fill="#7ce4d0"/>
      <circle cx="210" cy="173" r="9" fill="#a9caff"/>
      <circle cx="334" cy="173" r="7" fill="#a9caff"/>
      <text x="224" y="121" font-size="13" fill="#7ce4d0">재시도 함</text>
      <text x="224" y="205" font-size="13" fill="#a9caff">재시도 안 함</text>
      <text x="24" y="225" font-size="12" fill="#829dac">입력 → 조건 → 결과</text>
    </g>
  </g>
</svg>
